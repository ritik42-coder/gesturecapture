name: Build APK
on:
  push:
    paths: ['app.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unpack and configure
        run: |
          unzip -q app.zip -d src
          D=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "D=$D" >> $GITHUB_ENV
          URL=""
          [ -f netlify_url.txt ] && URL=$(tr -d ' \r\n' < netlify_url.txt)
          case "$URL" in http*|"") ;; *) URL="https://$URL" ;; esac
          M=$D/app/src/main/java/com/raja/gesturecapture/MainActivity.kt
          sed -i "s#NETLIFY_URL_PLACEHOLDER#$URL#" $M
          sed -i "s#REPO_PLACEHOLDER#${{ github.repository }}#" $M
      - name: Signing key
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias gc -keyalg RSA -keysize 2048 -validity 10000 -storepass gesturecapture -keypass gesturecapture -dname "CN=GestureCapture"
            git config user.name github-actions
            git config user.email actions@github.com
            git add keystore.jks
            git commit -m "Add signing key"
            git push
          fi
          echo "KS_PATH=$PWD/keystore.jks" >> $GITHUB_ENV
      - name: Build
        working-directory: ${{ env.D }}
        env:
          KS_PASS: gesturecapture
          KS_ALIAS: gc
        run: gradle assembleRelease -Pvn=1.0.${{ github.run_number }} -Pvc=${{ github.run_number }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Version 1.0.${{ github.run_number }}
          files: ${{ env.D }}/app/build/outputs/apk/release/app-release.apk
